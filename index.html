<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Lanka Dahan — Sundara Kanda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b0a14;
      position: fixed;
      inset: 0;
    }
    #game-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0a14;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Touch controls — crisp landscape layout in bottom corners */
    #touch-controls {
      display: none;
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      height: 72px;
      pointer-events: none;
      z-index: 100;
      justify-content: space-between;
      align-items: flex-end;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #touch-controls.active { display: flex; }
    .touch-group {
      display: flex;
      gap: 12px;
      pointer-events: none;
    }
    .touch-zone {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(18, 20, 43, 0.65);
      border: 2px solid rgba(240, 184, 61, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff1a8;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .touch-zone.pressed, .touch-zone:active {
      background: rgba(255, 122, 26, 0.55);
      border-color: #fffbe0;
      transform: scale(0.95);
    }

    /* Landscape orientation hint for phones */
    @media (max-width: 600px) and (orientation: portrait) {
      #rotate-hint {
        display: flex !important;
        position: fixed; inset: 0;
        background: #0b0a14ee;
        color: #f0b83d;
        font-family: monospace;
        font-size: 1.1rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 1rem;
      }
      #rotate-hint::before { content: '🔄'; font-size: 3rem; }
    }
    #rotate-hint { display: none; }
  </style>
</head>
<body>
  <div id="rotate-hint">Rotate your device to landscape</div>
  <div id="game-wrapper">
    <div id="game-container"></div>
  </div>
  <div id="touch-controls">
    <div class="touch-group">
      <div id="touch-left" class="touch-zone" aria-label="Move Left">◀</div>
      <div id="touch-right" class="touch-zone" aria-label="Move Right">▶</div>
    </div>
    <div class="touch-group">
      <div id="touch-whip" class="touch-zone" aria-label="Tail Whip">🔥</div>
      <div id="touch-jump" class="touch-zone" aria-label="Jump">⬆</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
